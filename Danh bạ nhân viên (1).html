<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danh bạ nhân viên</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --page:#e5e9ea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#14201c; } }
  html, body { height:100%; margin:0; background:var(--page); font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  @keyframes slideIn { from { opacity:0; transform:translateX(24px);} to { opacity:1; transform:none;} }
  @keyframes fadeIn { from { opacity:0;} to { opacity:1;} }
  @keyframes sheetUp { from { transform:translateY(100%);} to { transform:none;} }
  .slide-in { animation:slideIn .25s ease-out; }
  .fade-in { animation:fadeIn .2s ease-out; }
  .sheet-up { animation:sheetUp .3s cubic-bezier(.2,.8,.2,1); }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// ---------- Dữ liệu mock ----------
const UNIT = "Trung tâm Phát triển phần mềm";
const EMPLOYEES = [
  { id: 1, name: "Nguyễn Bình An",   title: "Chuyên viên cấp 3",                    phone: "+84901234561", email: "anNB@ite.com.vn",    code: "BIDV10101" },
  { id: 2, name: "Tạ Hồng Nhung",    title: "Chuyên viên kiểm thử cấp 3",           phone: "+84901234562", email: "nhungth@ite.com.vn", code: "BIDV10188" },
  { id: 3, name: "Dương Thị Oanh",   title: "Chuyên viên kiểm thử cấp 3",           phone: "+84901234563", email: "oanhdt@ite.com.vn",  code: "BIDV10215" },
  { id: 4, name: "Văn Thị Huyền",    title: "Chuyên viên kiểm thử cấp 3",           phone: "+84862947305", email: "huyenvt@ite.com.vn", code: "BIDV10234" },
  { id: 5, name: "Nguyễn Việt Dũng", title: "Chuyên viên cấp 4",                    phone: "+84901234565", email: "dungnv@ite.com.vn",  code: "BIDV10302" },
  { id: 6, name: "Nguyễn Huyền Chi", title: "Chuyên viên phân tích nghiệp vụ cấp 3", phone: "+84901234566", email: "chinh@ite.com.vn",   code: "BIDV10377" },
].map(e => ({ ...e, unit: UNIT }));

const TEXT = {
  VIE: { scan: "Quét mã QR để lưu thông tin liên hệ", share: "Chia sẻ", copied: "Đã sao chép" },
  ENG: { scan: "Scan QR code to save contact",       share: "Share",    copied: "Copied" },
};

// ---------- Tiện ích ----------
// Bỏ dấu tiếng Việt + chữ thường để tìm kiếm
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

// Tạo chuỗi vCard cho QR
const makeVCard = e => [
  "BEGIN:VCARD", "VERSION:3.0", `FN:${e.name}`, `TEL;TYPE=CELL:${e.phone}`,
  `EMAIL:${e.email}`, `ORG:${e.unit}`, `TITLE:${e.title}`, "END:VCARD",
].join("\n");

// ---------- Icon ----------
const Svg = ({ children, className = "w-6 h-6", ...p }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} {...p}>{children}</svg>
);
const IconBack   = () => <Svg><path d="M15 5l-7 7 7 7" /></Svg>;
const IconChev   = () => <Svg className="w-5 h-5"><path d="M9 5l7 7-7 7" /></Svg>;
const IconClose  = () => <Svg><path d="M6 6l12 12M18 6L6 18" /></Svg>;
const IconSearch = () => <Svg className="w-5 h-5"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></Svg>;
const IconPhone  = () => <Svg className="w-5 h-5"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z" /></Svg>;
const IconMail   = () => <Svg className="w-5 h-5"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 7l9 6 9-6" /></Svg>;
const IconBuild  = () => <Svg className="w-5 h-5"><path d="M4 21V4a1 1 0 011-1h8a1 1 0 011 1v17M14 9h5a1 1 0 011 1v11M3 21h18M8 7h2M8 11h2M8 15h2M17 13h1M17 17h1" /></Svg>;
const IconId     = () => <Svg className="w-5 h-5"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="11" r="2" /><path d="M6 16c.5-1.5 1.7-2 3-2s2.5.5 3 2M14 10h4M14 14h4" /></Svg>;
const IconEdit   = () => <Svg><path d="M4 20h4L19 9a2.1 2.1 0 00-3-3L5 17v3z" /><path d="M14 7l3 3" /></Svg>;
const IconQr     = () => <Svg className="w-6 h-6"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><path d="M14 14h3v3h-3zM20 14v1M17 20h4M14 20v1" /></Svg>;

// Hoa mai vàng có ngôi sao ở giữa
const star = (R, r) => Array.from({ length: 10 }, (_, i) => {
  const a = -Math.PI / 2 + (i * Math.PI) / 5, d = i % 2 ? r : R;
  return `${(Math.cos(a) * d).toFixed(1)},${(Math.sin(a) * d).toFixed(1)}`;
}).join(" ");

const Flower = ({ className = "w-8 h-8", dark = "#0B5C47" }) => (
  <svg viewBox="0 0 100 100" className={className}>
    <g transform="translate(50 50)">
      {[0, 72, 144, 216, 288].map(r => <ellipse key={r} cx="0" cy="-22" rx="19" ry="24" fill="#F2B705" transform={`rotate(${r})`} />)}
      <polygon points={star(26, 11)} fill={dark} stroke="#F2B705" strokeWidth="2" strokeLinejoin="round" />
    </g>
  </svg>
);

const Avatar = ({ size = 56 }) => (
  <div className="rounded-full bg-[#E3E6E8] flex items-center justify-center shrink-0" style={{ width: size, height: size }}>
    <div className="rounded-full bg-[#0B5C47] flex items-center justify-center" style={{ width: size * 0.78, height: size * 0.78 }}>
      <Flower className="w-[62%] h-[62%]" />
    </div>
  </div>
);

const BidvLogo = ({ dark }) => (
  <div className="flex items-start gap-0.5">
    <span className={`text-[26px] font-extrabold tracking-tight leading-none ${dark ? "text-[#0B5C47]" : "text-white"}`}>BIDV</span>
    <Flower className="w-6 h-6 -mt-1" dark={dark ? "#0B5C47" : "#0B5C47"} />
  </div>
);

// ---------- Status bar giả lập ----------
const StatusBar = () => {
  const [t, setT] = useState(() => new Date());
  useEffect(() => { const i = setInterval(() => setT(new Date()), 15000); return () => clearInterval(i); }, []);
  const time = t.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit", hour12: false });
  return (
    <div className="flex items-center justify-between px-8 pt-3 pb-2 text-white text-[17px] font-semibold">
      <span>{time}</span>
      <div className="flex items-center gap-1.5">
        <svg viewBox="0 0 18 12" className="w-[18px] h-3" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" opacity=".4"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
        <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M2 9a15 15 0 0120 0M5 13a10 10 0 0114 0M8.5 16.5a5 5 0 017 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
        <span className="bg-white text-[#0B5C47] text-[13px] font-bold rounded-md px-1.5 leading-5">68</span>
      </div>
    </div>
  );
};

// ---------- Màn hình 1: Danh bạ ----------
const SearchBar = ({ value, onChange }) => (
  <div className="flex items-center gap-3 bg-white rounded-2xl px-4 h-[52px] text-slate-500">
    <IconSearch />
    <input value={value} onChange={e => onChange(e.target.value)} placeholder="Tìm theo tên, phòng ban..."
      className="flex-1 bg-transparent outline-none text-[16px] text-slate-800 placeholder:text-slate-400" />
  </div>
);

const EmployeeCard = ({ e, onClick }) => (
  <button onClick={onClick} className="w-full flex items-center gap-3 bg-white rounded-2xl p-3.5 text-left shadow-[0_1px_3px_rgba(0,0,0,.05)] active:scale-[.99] transition">
    <Avatar size={58} />
    <div className="flex-1 min-w-0">
      <div className="text-[#1F8A70] text-[14px] font-semibold leading-tight">{e.title}</div>
      <div className="text-[19px] font-bold text-slate-900 leading-snug">{e.name}</div>
      <div className="text-[14.5px] text-slate-500 leading-tight">{e.unit}</div>
    </div>
    <span className="text-slate-400"><IconChev /></span>
  </button>
);

const ListScreen = ({ employees, onOpen }) => {
  const [q, setQ] = useState("");
  const list = useMemo(() => {
    const k = norm(q.trim());
    return employees.filter(e => norm(`${e.name} ${e.title} ${e.unit}`).includes(k));
  }, [q, employees]);
  return (
    <div className="flex flex-col h-full fade-in">
      <div className="bg-[#0B5C47] rounded-b-[28px] pb-5 shrink-0">
        <StatusBar />
        <div className="px-6 pt-3">
          <BidvLogo />
          <h1 className="text-white text-[27px] font-bold mt-5 leading-tight">Danh bạ nhân viên</h1>
          <p className="text-white/70 text-[15px] mb-4">{list.length} nhân viên</p>
          <SearchBar value={q} onChange={setQ} />
        </div>
      </div>
      <div className="flex-1 overflow-y-auto px-5 pt-6 pb-8">
        <div className="text-[13px] font-semibold tracking-[.12em] text-slate-500 mb-3">NHÂN VIÊN</div>
        <div className="space-y-3">
          {list.map(e => <EmployeeCard key={e.id} e={e} onClick={() => onOpen(e)} />)}
        </div>
        {list.length === 0 && <div className="text-center text-slate-500 py-12">Không tìm thấy nhân viên</div>}
      </div>
    </div>
  );
};

// ---------- Màn hình 2: Thông tin cá nhân ----------
const InfoRow = ({ icon, label, value, href, last }) => {
  const Tag = href ? "a" : "div";
  return (
    <Tag href={href} className={`flex items-center gap-4 px-4 py-3.5 text-[#0B5C47] ${last ? "" : "border-b border-slate-100"}`}>
      {icon}
      <div className="min-w-0">
        <div className="text-[13px] text-slate-500 leading-tight">{label}</div>
        <div className="text-[17px] text-slate-900 leading-snug break-words">{value}</div>
      </div>
    </Tag>
  );
};

const DetailScreen = ({ e, onBack, onQr, onEdit }) => (
  <div className="flex flex-col h-full slide-in bg-[#F2F4F5]">
    <div className="bg-[#0B5C47] shrink-0">
      <StatusBar />
      <div className="flex items-center justify-between px-4 pb-3 text-white">
        <button onClick={onBack} className="flex items-center gap-3 text-[18px] font-medium"><IconBack />Thông tin cá nhân</button>
        <div className="flex items-center gap-4">
          <button onClick={onEdit} aria-label="Chỉnh sửa"><IconEdit /></button>
          <button onClick={onQr} aria-label="Mã QR"><IconQr /></button>
        </div>
      </div>
    </div>
    <div className="flex-1 overflow-y-auto px-5 pt-8 pb-8">
      <div className="flex flex-col items-center text-center mb-7">
        <Avatar size={116} />
        <div className="text-[#1F8A70] text-[15.5px] font-semibold mt-5">{e.title}</div>
        <div className="text-[27px] font-bold text-slate-900 leading-tight">{e.name}</div>
      </div>
      <div className="bg-white rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,.05)] overflow-hidden">
        <InfoRow icon={<IconPhone />} label="Điện thoại di động" value={e.phone} href={`tel:${e.phone}`} />
        <InfoRow icon={<IconMail />} label="Email" value={e.email} href={`mailto:${e.email}`} />
        <InfoRow icon={<IconBuild />} label="Đơn vị công tác" value={e.unit} />
        <InfoRow icon={<IconId />} label="Mã cán bộ" value={e.code} last />
      </div>
      <button onClick={onQr} className="w-full mt-6 h-[54px] rounded-xl bg-[#0B5C47] text-white text-[18px] font-semibold active:opacity-90">Hiển thị mã QR</button>
    </div>
  </div>
);

// ---------- Màn hình 3: Bottom sheet QR ----------
// Sinh QR thật từ vCard (UTF-8) và vẽ bằng SVG
const QRCode = ({ text }) => {
  const { size, path } = useMemo(() => {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    const qr = qrcode(0, "M");
    qr.addData(text); qr.make();
    const n = qr.getModuleCount();
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return { size: n, path: d };
  }, [text]);
  return (
    <svg viewBox={`-2 -2 ${size + 4} ${size + 4}`} className="w-[250px] h-[250px]" shapeRendering="crispEdges">
      <rect x="-2" y="-2" width={size + 4} height={size + 4} fill="#fff" />
      <path d={path} fill="#000" />
    </svg>
  );
};

const QRSheet = ({ e, onClose }) => {
  const [lang, setLang] = useState("VIE");
  const [menu, setMenu] = useState(false);
  const [toast, setToast] = useState("");
  const t = TEXT[lang];
  const vcard = useMemo(() => makeVCard(e), [e]);

  const share = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: e.name, text: vcard }); return; }
      await navigator.clipboard.writeText(vcard);
    } catch (err) {
      if (err && err.name === "AbortError") return;
      // Dự phòng khi clipboard bị chặn
      const ta = document.createElement("textarea"); ta.value = vcard; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (_) {}
      ta.remove();
    }
    setToast(t.copied); setTimeout(() => setToast(""), 1800);
  };

  return (
    <div className="absolute inset-0 z-30 flex flex-col justify-end">
      <div className="absolute inset-0 bg-black/45 fade-in" onClick={onClose} />
      <div className="relative bg-white rounded-t-[26px] sheet-up max-h-[92%] overflow-y-auto">
        <div className="mx-auto mt-2.5 w-10 h-1 rounded-full bg-slate-300" />
        <div className="flex items-center justify-between px-5 py-3.5 border-b border-slate-200">
          <div className="flex items-center gap-5 text-slate-900">
            <button onClick={onClose} aria-label="Đóng"><IconClose /></button>
            <span className="text-[18px]">QR code</span>
          </div>
          <div className="relative">
            <button onClick={() => setMenu(m => !m)} className="flex items-center gap-1.5 border border-slate-200 rounded-lg px-3 h-9 text-[15px] text-slate-800">
              {lang}<Svg className="w-4 h-4"><path d="M6 9l6 6 6-6" /></Svg>
            </button>
            {menu && (
              <div className="absolute right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden z-10">
                {["VIE", "ENG"].map(l => (
                  <button key={l} onClick={() => { setLang(l); setMenu(false); }} className={`block w-20 text-left px-3 py-2 text-[15px] ${l === lang ? "bg-slate-100 font-semibold" : ""}`}>{l}</button>
                ))}
              </div>
            )}
          </div>
        </div>
        <div className="flex flex-col items-center px-5 pt-5 pb-4">
          <BidvLogo dark />
          <div className="mt-4"><QRCode text={vcard} /></div>
          <p className="text-[15px] text-slate-500 mt-4">{t.scan}</p>
          <div className="w-52 h-px bg-slate-200 my-4" />
          <div className="text-[#1F8A70] text-[15px] font-semibold">{e.title}</div>
          <div className="text-[25px] font-medium text-slate-900 uppercase text-center">{e.name}</div>
          <div className="text-[18px] text-slate-500">{e.phone}</div>
          <div className="text-[16.5px] text-slate-500">{e.unit}</div>
        </div>
        <div className="px-5 pb-8 pt-2">
          <button onClick={share} className="w-full h-[54px] rounded-xl bg-[#0B5C47] text-white text-[18px] font-semibold active:opacity-90">{t.share}</button>
        </div>
      </div>
      {toast && <div className="absolute bottom-28 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 text-white text-[15px] px-4 py-2 rounded-full fade-in">{toast}</div>}
    </div>
  );
};

// ---------- Bottom sheet chỉnh sửa thông tin ----------
const FIELDS = [
  ["name", "Họ và tên", "text"], ["title", "Chức danh", "text"], ["phone", "Điện thoại di động", "tel"],
  ["email", "Email", "email"], ["unit", "Đơn vị công tác", "text"], ["code", "Mã cán bộ", "text"],
];

const EditSheet = ({ e, onSave, onClose }) => {
  const [f, setF] = useState(e);
  const [err, setErr] = useState({});
  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); setErr(p => ({ ...p, [k]: "" })); };

  // Kiểm tra dữ liệu rồi lưu
  const submit = () => {
    const v = {}, er = {};
    FIELDS.forEach(([k]) => { v[k] = (f[k] || "").trim(); if (!v[k]) er[k] = "Không được để trống"; });
    v.phone = v.phone.replace(/\s/g, "");
    if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) er.email = "Email không hợp lệ";
    if (v.phone && !/^\+?[0-9]{9,15}$/.test(v.phone)) er.phone = "Số điện thoại không hợp lệ";
    setErr(er);
    if (!Object.keys(er).length) onSave({ ...e, ...v });
  };

  return (
    <div className="absolute inset-0 z-30 flex flex-col justify-end">
      <div className="absolute inset-0 bg-black/45 fade-in" onClick={onClose} />
      <div className="relative bg-white rounded-t-[26px] sheet-up max-h-[92%] flex flex-col">
        <div className="mx-auto mt-2.5 w-10 h-1 rounded-full bg-slate-300" />
        <div className="flex items-center gap-5 px-5 py-3.5 border-b border-slate-200 text-slate-900">
          <button onClick={onClose} aria-label="Đóng"><IconClose /></button>
          <span className="text-[18px]">Chỉnh sửa thông tin</span>
        </div>
        <div className="flex-1 overflow-y-auto px-5 pt-4 space-y-4">
          {FIELDS.map(([k, label, type]) => (
            <label key={k} className="block">
              <span className="text-[13px] text-slate-500">{label}</span>
              <input type={type} value={f[k]} onChange={ev => set(k, ev.target.value)}
                className={`mt-1 w-full h-12 rounded-xl border px-3 text-[16px] text-slate-900 bg-white outline-none focus:border-[#0B5C47] ${err[k] ? "border-red-400" : "border-slate-300"}`} />
              {err[k] && <span className="text-[13px] text-red-500">{err[k]}</span>}
            </label>
          ))}
        </div>
        <div className="flex gap-3 px-5 pt-4 pb-8">
          <button onClick={onClose} className="flex-1 h-[54px] rounded-xl border border-[#0B5C47] text-[#0B5C47] text-[18px] font-semibold">Hủy</button>
          <button onClick={submit} className="flex-1 h-[54px] rounded-xl bg-[#0B5C47] text-white text-[18px] font-semibold active:opacity-90">Lưu</button>
        </div>
      </div>
    </div>
  );
};

// ---------- App ----------
const App = () => {
  const [employees, setEmployees] = useState(EMPLOYEES);
  const [selected, setSelected] = useState(null); // null = màn danh bạ
  const [editOpen, setEditOpen] = useState(false);
  // Lưu thông tin đã chỉnh sửa vào danh sách
  const save = u => { setEmployees(l => l.map(x => x.id === u.id ? u : x)); setSelected(u); setEditOpen(false); };
  const [qrOpen, setQrOpen] = useState(false);
  return (
    <div className="min-h-full flex items-center justify-center sm:p-4">
      <div className="relative w-full max-w-[390px] h-[100dvh] sm:h-[844px] sm:max-h-[94vh] bg-[#F2F4F5] sm:rounded-[36px] sm:shadow-2xl overflow-hidden">
        {selected
          ? <DetailScreen key={selected.id} e={selected} onBack={() => setSelected(null)} onQr={() => setQrOpen(true)} onEdit={() => setEditOpen(true)} />
          : <ListScreen employees={employees} onOpen={setSelected} />}
        {selected && qrOpen && <QRSheet e={selected} onClose={() => setQrOpen(false)} />}
        {selected && editOpen && <EditSheet e={selected} onSave={save} onClose={() => setEditOpen(false)} />}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
